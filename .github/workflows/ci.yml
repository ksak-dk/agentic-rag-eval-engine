name: CI — Ruff Lint + Mock Pytest

on:
  push:
    branches: ["main", "feat/**", "fix/**", "eval/**"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies (no extras)
        run: uv sync --no-dev --group lint

      - name: Ruff check
        run: uv run ruff check . --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Mock Pytest (no GPU / no external API)
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Force all GPU/API calls to mock mode in CI
      MOCK_LLM_STREAM: "true"
      PIPELINE_VERSION: "v3"
      GROQ_API_KEY: "ci-mock-key"
      GOOGLE_API_KEY: "ci-mock-key"
      QDRANT_URL: "http://localhost:6333"
      REDIS_URL: "redis://localhost:6379"
      LOG_LEVEL: "WARNING"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install all dependencies
        run: uv sync

      - name: Run tests (mocked, no GPU)
        run: uv run pytest tests/ -x --no-header -q --tb=short
