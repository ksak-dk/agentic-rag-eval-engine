[project]
name = "agentic-rag-eval-engine"
version = "2.0.2"
description = "Production-grade Agentic RAG pipeline with automated evaluation (v1/v2/v3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",

    # --- Pydantic V2 & Settings ---
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # --- LangGraph & LangChain ---
    "langgraph>=0.2.55",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",

    # --- Vector DB ---
    "qdrant-client[fastembed]>=1.12.0",
    "fastembed>=0.4.1",

    # --- Embedding & Reranking (sentence-transformers, NOT FlagEmbedding) ---
    "sentence-transformers>=3.3.0",

    # --- Redis (async) ---
    "redis[hiredis]>=5.2.0",

    # --- Structured Logging ---
    "structlog>=24.4.0",

    # --- Evaluation ---
    "ragas>=0.2.0",

    # --- Observability (optional SDK — always importable, Langfuse server on-demand) ---
    "langfuse>=3.0.0",

    # --- Utilities ---
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
]

[dependency-groups]
lint = [
    "ruff>=0.8.0",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
]

# ==============================================================================
# PyTorch — CUDA 12.4 explicit index (Windows: prevents CPU-only torch install)
# ==============================================================================
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ==============================================================================
# Ruff — Linter & Formatter
# ==============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "evals", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async (catches sync I/O in async functions)
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================================
# Pytest
# ==============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
